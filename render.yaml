# Render Blueprint for Open Ajar. In Render: New > Blueprint, pick this repo.
services:
  - type: web
    name: open-ajar            # becomes https://<name>.onrender.com if the name is free
    runtime: python
    plan: starter              # the disk below needs a paid plan; on free, the database is wiped on every deploy/restart
    region: virginia
    buildCommand: pip install -r requirements.txt
    # One worker on purpose: rate limits and the reminder timer live in that process.
    startCommand: gunicorn -w 1 --threads 8 'app:create_app()'
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY        # signs the login cookie; Render generates a random one
        generateValue: true
      - key: DB_PATH
        value: /data/openajar.db
      - key: TRUST_PROXY       # Render sits in front of the app; needed for per-IP rate limits
        value: "1"
      - key: APP_URL           # set to https://<name>.onrender.com (or your custom domain)
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM        # e.g. Open Ajar <hello@yourdomain.org>, once the domain is verified in Resend
        sync: false
    disk:
      name: openajar-data
      mountPath: /data
      sizeGB: 1
