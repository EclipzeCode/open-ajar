{# Page links under an admin list (admin.paged gives pg). #}
<p class="muted small">{{ '{:,}'.format(pg.total) }} in all{% if pg.pages > 1 %} · page {{ pg.page }} of {{ pg.pages }}{% endif %}</p>
{% if pg.pages > 1 %}
<nav class="pager" aria-label="Pages">
  {% if pg.page > 1 %}<a class="btn btn--ghost btn--sm" href="{{ page_url(pg.page - 1) }}">← Previous</a>{% endif %}
  {% if pg.page < pg.pages %}<a class="btn btn--ghost btn--sm" href="{{ page_url(pg.page + 1) }}">Next →</a>{% endif %}
</nav>
{% endif %}
